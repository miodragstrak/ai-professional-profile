[project]
name = "ai-professional-profile"
version = "0.1.0"
description = "A public MCP server for Miodrag Strak's professional profile."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.139,<1",
    "uvicorn>=0.51,<1",
    "mcp>=1.28.1,<2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "mcp_server"]

[tool.setuptools.data-files]
"." = ["profile.json"]
